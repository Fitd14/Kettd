<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>悬浮面板 · 待办列表</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="float-app" id="app">
    <header class="float-head">
      <span class="text-foreground" style="font-weight:600">今天</span>
      <span class="tiny text-muted" id="headCount">—</span>
      <span class="grow"></span>
      <button class="btn ghost xs" id="btnManage" title="打开主窗口 · 计划">管理</button>
      <button class="btn ghost xs" id="btnHide" title="收进托盘（悬浮面板隐藏，进程不退）">收起</button>
    </header>
    <section class="float-body" id="body">
      <div class="row-flex" style="gap:6px">
        <input class="input" id="quick" placeholder="记下… 明天 15:00 #学习 !高" maxlength="200" />
        <button class="btn sm" id="quickAdd">记下</button>
      </div>
      <div class="cap-chips" id="chips" style="margin-top:2px"></div>
      <div class="inline-err" id="quickErr" hidden></div>
      <div>
        <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i style="width:0%"></i></div>
        <div class="row-flex spread tiny text-muted" style="margin-top:4px"><span id="statCount">—</span><span id="nextRem">下一条 —</span></div>
      </div>
      <div class="sec" style="margin-top:0">今天要做的 · <span id="pendN">0</span></div>
      <div id="list"></div>
      <div id="overdue"></div>
    </section>
    <footer class="float-foot">
      <span id="formHint">形态：置于顶层 · 托盘菜单可切</span>
      <span><a href="#" id="openMain" style="color:inherit;text-decoration:none">打开主界面</a></span>
    </footer>
  </div>
  <div class="ministrip" id="ministrip" title="点开主界面">
    <span class="l">今天剩 <b id="mRemain">0</b><span id="mUnit"> 件</span></span>
    <span class="r">下一条 <span id="mNext">—</span></span>
  </div>

  <script type="module">
import * as api from './api.js';

const $ = (id) => document.getElementById(id);
const today = () => api.localToday();
const S = { tasks: [], reminders: [], settings: null, health: null, quick: '', quickErr: '', lastOk: '' };

let booted = false;
async function refresh() {
  const r = await api.getBootstrap();
  if (r.err) { showError(r.err); return; }
  const b = r.data;
  S.tasks = b.tasks || [];
  S.reminders = b.reminders || [];
  S.settings = b.settings || S.settings;
  S.health = b.health;
  booted = true;
  api.applyTheme(S.settings && S.settings.theme);
  render();
}
/* 事件驱动的轻刷新：get_tasks + get_reminders（V2-API §8 数据面），settings/health 变化罕见、随全量兜底 */
async function lightRefresh() {
  if (!booted) return refresh();
  const [t, rm] = await Promise.all([api.getTasks(), api.getReminders()]);
  if (t.err || rm.err) { showError(t.err || rm.err); return; }
  S.tasks = t.data || [];
  S.reminders = rm.data || [];
  render();
}
function showError(msg) {
  document.body.classList.remove('mini', 'desktop', 'topmost');
  const box = $('body');
  if (box) box.innerHTML = `<div class="empty-hint sm">数据文件已损坏：${api.esc(msg || '请先恢复')}<div style="margin-top:6px"><button class="btn sm" id="goRecover">去恢复 →</button></div></div>`;
  const g = $('goRecover');
  if (g) g.addEventListener('click', async () => { await api.openMainWindow(); api.emitNavigate('/settings'); });
}

const live = () => S.tasks.filter((t) => !t.deletedAt);
const pending = () => live().filter((t) => api.isPlannedToday(t, today()));
const doneCnt = () => live().filter((t) => api.isDoneToday(t, today())).length;
const overdue = () => live().filter((t) => api.isOverdue(t, today()));

function render() {
  if (S.health && S.health.health === 'corrupt') { showError('数据文件已损坏'); return; }
  const form = (S.settings && S.settings.floatForm) || 'topmost';
  document.body.classList.toggle('mini', form === 'mini');
  document.body.classList.toggle('desktop', form === 'desktop');
  document.body.classList.toggle('topmost', form === 'topmost');
  const pend = pending();
  const done = doneCnt();
  const total = done + pend.length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  const ov = overdue();
  const carry = pend.filter((t) => api.isCarry(t)).length;
  const next = api.nextReminderTime(S.tasks, S.reminders) || '—';
  $('headCount').textContent = `${done}/${total}`;
  $('bar').firstElementChild.style.width = pct + '%';
  $('bar').setAttribute('aria-valuenow', String(pct));
  $('statCount').textContent = `做完 ${done} · 剩 ${pend.length} · 拖到今天 ${carry} · 逾期 ${ov.length}`;
  $('nextRem').textContent = `下一条 ${next}`;
  $('pendN').textContent = String(pend.length);
  $('formHint').textContent = form === 'mini' ? '形态：迷你条 · 托盘菜单可切' : form === 'desktop' ? '形态：嵌入桌面 · 失焦自动收起' : '形态：置于顶层 · 托盘菜单可切';
  $('list').innerHTML = pend.length ? pend.slice(0, 7).map((t) => `
    <div class="trow" data-id="${api.esc(t.id)}" tabindex="0" role="button">
      <input type="checkbox" class="tcheck" data-t="${api.esc(t.id)}" aria-label="完成 ${api.esc(t.title)}">
      <span class="grow truncate sm">${api.esc(t.title)}${api.isCarry(t) ? ` <span class="badge">拖了 ${t.carriedFrom} 天</span>` : ''}</span>
      <code class="tmeta mono ${t.dueAt ? api.formatDue(t.dueAt, today()).cls : ''}">${t.dueAt ? api.esc(api.formatDue(t.dueAt, today()).text) : '—'}</code>
    </div>`).join('') : '<div class="tiny text-muted">今天还没有挑出来的事项。</div>';
  $('overdue').innerHTML = ov.length ? `<button class="btn ghost xs" id="ovBtn" style="color:hsl(var(--destructive));margin-top:4px">▸ 已逾期 ${ov.length} 项 · 去主界面逐条安排</button>` : '';
  const ob = $('ovBtn');
  if (ob) ob.addEventListener('click', async () => { await api.openMainWindow(); api.emitNavigate('/today'); });
  $('list').querySelectorAll('.tcheck').forEach((c) => c.addEventListener('click', async (e) => {
    e.stopPropagation();
    const id = c.dataset.t;
    const r = await api.toggleTask(id);
    if (r.err) { flash(r.err, true); }
    lightRefresh();
  }));
  $('list').querySelectorAll('.trow').forEach((row) => row.addEventListener('click', async () => {
    await api.openMainWindow();
    api.emitNavigate('/today?open=' + encodeURIComponent(row.dataset.id));
  }));
  const m = $('ministrip');
  const remain = pend.length;
  $('mRemain').textContent = remain === 0 ? '清零 ✓' : (remain > 99 ? '99+' : String(remain));
  $('mUnit').textContent = remain === 0 ? '' : ' 件';
  $('mNext').textContent = next;
  renderChips();
  const qe = $('quick');
  if (qe && document.activeElement !== qe) qe.value = S.quick;
}
function renderChips() {
  const p = S.quick.trim() ? api.parseCapture(S.quick, today()) : null;
  $('chips').innerHTML = p && p.chips.length
    ? p.chips.map((c) => `<span class="chip">${api.esc(c.value)}</span>`).join('') + (p.autoRemind ? '<span class="badge">随截止自动提醒</span>' : '')
    : '';
}
function flash(msg, bad) {
  const e = $('quickErr');
  e.hidden = false;
  e.textContent = msg;
  e.classList.toggle('text-muted', !bad);
  e.classList.toggle('inline-err', !!bad);
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { e.hidden = true; }, bad ? 6000 : 2500);
}
async function commitQuick() {
  const raw = S.quick.trim();
  if (!raw) { $('quick').classList.add('invalid'); flash('标题不能为空，先写几个字', true); return; }
  $('quick').classList.remove('invalid');
  const parsed = api.parseCapture(raw, today());
  const args = { title: parsed.title, source: 'capture', category: parsed.category || '生活', priority: parsed.priority || 'med' };
  if (parsed.dueAt) { args.dueAt = parsed.dueAt; args.remindAt = parsed.autoRemind ? parsed.dueAt : null; }
  const r = await api.addTask(args);
  if (r.err) { S.quickErr = r.err; flash(r.err + ' · 输入已保留，可点「记下」重试', true); return; }
  S.quick = '';
  $('quick').value = '';
  flash(`已记下 ·「${r.data.title}」`, false);
  lightRefresh();
}
$('quick').addEventListener('input', (e) => { S.quick = e.target.value; S.quickErr = ''; e.target.classList.remove('invalid'); renderChips(); });
$('quick').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); commitQuick(); } if (e.key === 'Escape') { S.quick = ''; e.target.value = ''; renderChips(); } });
$('quickAdd').addEventListener('click', commitQuick);
$('btnManage').addEventListener('click', async () => { await api.openMainWindow(); api.emitNavigate('/planned'); });
$('btnHide').addEventListener('click', () => api.hideFloat());
$('openMain').addEventListener('click', async (e) => { e.preventDefault(); await api.openMainWindow(); });
$('ministrip').addEventListener('click', async () => { await api.openMainWindow(); });

api.onEvent('store-changed', api.debounce(lightRefresh, 200));
api.onEvent('theme-changed', (t) => api.applyTheme(t));
api.onEvent('navigate', (route) => { if (String(route).startsWith('/today') || String(route).startsWith('/planned')) api.openMainWindow(); });
setInterval(() => { refresh().catch(() => { /* 心跳兜底静默，下轮再试 */ }); }, 30000);
refresh().catch(() => { /* 初次失败已由 showError 呈现 */ });
  </script>
</body>
</html>
