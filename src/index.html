<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待办列表</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><span class="brand-dot" aria-hidden></span><span class="brand-name">Kettd <span class="text-muted" style="font-weight:400">v2</span></span></div>
      <nav id="nav" aria-label="主导航"></nav>
      <div class="side-note"><span class="kbd">N</span> 新建 · <span class="kbd">/</span> 搜索</div>
    </aside>
    <main class="main" id="main">
      <div id="banners"></div>
      <div class="wrap" id="view"></div>
    </main>
  </div>
  <div id="overlayRoot"></div>
  <div id="modalRoot"></div>
  <div class="toasts" id="toastRoot" aria-live="polite"></div>

  <script type="module">
import * as api from './api.js';
/* 提醒时刻编辑器的语义实现在共享内核里（ADR-0006）：
   vanilla 三窗与 src-react 共用同一份，node 测试直接 import 它，不再抽本文件源码。 */
import {
  parseRemTime, composeRemTime, nextTimesForMode, removeTimeSlot, appendTimeSlot,
  prettyRemTime, renderRemEditor, emptyRemDraft, normMode, REM_ERRORS,
} from './kernel/rem-editor.js';

const $ = (id) => document.getElementById(id);
const esc = api.esc;
const today = () => api.localToday();
const ROUTES = ['today', 'inbox', 'planned', 'review', 'settings'];
const NAVS = [['today', '今天', '✓'], ['inbox', '收件箱', '▤'], ['planned', '计划', '▦'], ['review', '回顾', '«»'], ['settings', '设置', '⚙']];

const S = {
  tasks: [], reminders: [], settings: null, health: null, migration: null, hints: null,
  hotkeys: null,
  route: 'today',
  loading: true, bootErr: '',
  drafts: { today: '', inbox: '', remTitle: '', remMode: 'daily', remTimes: [''], remDate: '', remEditMode: 'daily', remEditTimes: [''], remEditDate: '', sub: '', noteNew: '', hotkey: '', mainHotkey: '', dir: '', retry: '', dndFrom: '', dndTo: '', capHour: '' },
  remEdit: null,
  pastValue: '',
  errs: {}, newErr: '',
  failedId: null, overdueOpen: false, expandedId: null,
  focusRow: null,
  undoTimer: null,
  search: { open: false, q: '', debounced: '', busy: false, sel: 0 },
  onb: { step: 0, item: '', savedTitle: '', hotkeyMsg: '' },
  confirm: null,
  review: { tab: 'log', week: 'current', excl: new Set() },
  exportMsg: '', exportFmt: 'md', retryRow: false, lastExport: '',
  trashOpen: false, trash: null, backups: undefined,
  capFallback: null,
  toasts: {}, toastSeq: 0,
};

const ACTS = {};

/* ---------------- toast ---------------- */
function toast(text, opt) {
  const o = opt || {};
  const id = ++S.toastSeq;
  S.toasts[id] = { text, kind: o.kind || '', action: o.action || null, onAction: o.onAction || null, arg: o.arg || '', ms: o.ms || 0 };
  renderToasts();
  if (o.ms) setTimeout(() => { delete S.toasts[id]; renderToasts(); }, o.ms);
  return id;
}
function renderToasts() {
  $('toastRoot').innerHTML = Object.keys(S.toasts).map((k) => {
    const t = S.toasts[k];
    const act = t.action ? `<button class="btn sm outline" data-act="${esc(t.onAction)}" data-arg="${esc(k)}" data-id="${esc(t.arg)}">${esc(t.action)}</button>` : '';
    const extra = t.countdown ? `<span class="tiny text-muted" id="undoLeft">${t.left}s · 过期后进回收站（30 天）</span><span class="bar thin" style="width:56px"><i id="undoBar" style="width:${t.left * 10}%"></i></span>` : '';
    return `<div class="toast ${t.kind}" role="status"><span class="grow">${esc(t.text)}</span>${extra}${act}<button class="btn ghost xs" data-act="toast-close" data-arg="${esc(k)}" aria-label="关闭">✕</button></div>`;
  }).join('');
}
ACTS['toast-close'] = (el) => { delete S.toasts[el.dataset.arg]; renderToasts(); };

/* ---------------- 启动 / 刷新 ---------------- */
async function boot() {
  S.loading = true;
  render();
  const r = await api.getBootstrap();
  S.loading = false;
  if (r.err) { S.bootErr = r.err; render(); return; }
  S.bootErr = '';
  const b = r.data;
  S.tasks = b.tasks || [];
  S.reminders = b.reminders || [];
  S.settings = b.settings;
  S.health = b.health;
  S.migration = b.migration || null;
  if (!S.dirTouched && S.settings) S.drafts.dir = S.settings.exportDir || '';
  api.applyTheme(S.settings && S.settings.theme);
  const h = await api.getFormHints();
  if (!h.err) S.hints = h.data;
  const hk = await api.getHotkeyStatus();
  if (!hk.err) S.hotkeys = hk.data;
  if (S.settings && !S.settings.onboarded && S.health && S.health.health !== 'corrupt') {
    S.onb.step = clampStep(parseInt(localStorageGet('kettd.onb-step') || '0', 10));
  }
  render();
}
function clampStep(n) { return Number.isFinite(n) ? Math.min(Math.max(n, 0), 3) : 0; }
function localStorageGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch (_) { /* 隔离环境忽略 */ } }
function localStorageDel(k) { try { localStorage.removeItem(k); } catch (_) { /* 隔离环境忽略 */ } }

const softRefresh = api.debounce(async () => {
  const r = await api.getBootstrap();
  if (r.err) { toast(r.err, { kind: 'bad', ms: 5000 }); return; }
  const b = r.data;
  S.tasks = b.tasks || [];
  S.reminders = b.reminders || [];
  S.settings = b.settings || S.settings;
  S.health = b.health;
  if (!S.dirTouched && S.settings) S.drafts.dir = S.settings.exportDir || '';
  render();
}, 200);

/* ---------------- 损坏恢复（绝不显示空库假象；无关闭通道） ---------------- */
function syncRecoveryLayer() {
  const corrupt = S.health && S.health.health === 'corrupt';
  const exist = $('recoveryLayer');
  if (!corrupt) { if (exist) exist.remove(); renderRecovery(); return; }
  if (!exist) {
    const div = document.createElement('div');
    div.id = 'recoveryLayer';
    document.body.appendChild(div);
  }
  renderRecovery();
}
async function renderRecovery() {
  const layer = $('recoveryLayer');
  if (!layer) return;
  if (S.backups === undefined) { const b = await api.getBackups(); S.backups = b.err ? [] : b.data; renderRecovery(); return; }
  if (layer.dataset.still === '1' && $('recoveryBackups')) return;
  layer.dataset.still = '1';
  const backups = S.backups;
  const h = S.health || {};
  const anyReadable = backups.some((b) => b.readable);
  const list = backups.length === 0
    ? '<div class="empty-hint">还没生成过备份 —— 先「打开数据文件夹」找回 <span class="mono">data.v1.json</span>，再求助。</div>'
    : `<div class="sec" style="margin-top:12px">选择要恢复的备份（写盘前自动轮转 5 档）</div><div id="recoveryBackups">` + backups.map((b) => `
        <div class="listline"><b class="mono tiny">${esc(b.createdAt || ('备份 ' + b.slot))}</b>
          <span class="tiny text-muted grow">${esc(b.name)} · ${b.sizeKb}KB · ${b.taskCount} 条</span>
          ${b.readable
            ? `<button class="btn outline sm" data-act="backup-restore" data-arg="${esc(b.slot)}">恢复这份</button>`
            : `<span class="tiny text-destructive">${esc(b.error || '读不了')}</span>`}
        </div>`).join('') + '</div>';
  layer.innerHTML = `<div class="scrim" style="z-index:80"><div class="sheet wide" role="alertdialog" aria-label="数据恢复">
    <div class="row-flex spread"><h1 class="page" style="margin:0">无法读取数据文件</h1><span class="badge" style="color:hsl(var(--destructive));border-color:hsl(var(--destructive) / .4)">data.json 损坏</span></div>
    <p class="sm text-muted">这不是「你还没有任务」—— 文件读坏了；原文件一个字节都没动，损坏件另存为 <span class="mono tiny">${esc(h.corruptFile || 'data.corrupt.时间戳')}</span>，旧数据归档 <span class="mono tiny">data.v1.json</span> 永不删除。</p>
    ${h.lastError ? `<p class="tiny text-destructive">${esc(h.lastError)}</p>` : ''}
    ${anyReadable ? list : `<div class="card card-acc">
        <div class="sm"><b>连自动备份都读不了 —— 你的文件原样躺着，没被动过。</b></div>
        <div class="row-flex" style="gap:8px;margin-top:8px;flex-wrap:wrap">
          <button class="btn outline sm" data-act="open-data">打开数据文件夹</button>
          <button class="btn outline sm" data-act="copy-path" data-arg="${esc(h.corruptFile || '%APPDATA%/todo-list')}">复制损坏件路径</button>
        </div>
        <div class="tiny text-muted" style="margin-top:6px">求助时带上这段路径与备份文件；应用不会替你「重置成空任务」。</div>
      </div>`}
    <div class="row-flex" style="margin-top:12px;gap:8px">
      <button class="btn ghost sm" data-act="open-data">打开数据文件夹</button>
      <button class="btn sm" data-act="recovery-reload">已处理，重新读取</button>
    </div>
  </div></div>`;
}
ACTS['recovery-reload'] = () => { S.backups = undefined; boot(); };
ACTS['backup-restore'] = async (el) => {
  const r = await api.restoreBackup(el.dataset.arg);
  if (r.err) { toast(r.err, { kind: 'bad', ms: 6000 }); return; }
  toast(`已回滚到备份 ${el.dataset.arg}（恢复 ${r.data.restored} 条）`, { ms: 4000 });
  S.backups = undefined;
  boot();
};
ACTS['open-data'] = async () => { const r = await api.openDataFolder(); if (r.err) toast(r.err, { kind: 'bad', ms: 6000 }); };
ACTS['copy-path'] = (el) => {
  const v = el.dataset.arg || el.dataset.id;
  try { navigator.clipboard.writeText(v); toast('路径已复制', { ms: 2500 }); }
  catch (_) { toast(v, { ms: 8000 }); }
};

/* ---------------- 路由 ---------------- */
function parseHash() {
  const h = location.hash.replace(/^#/, '');
  const [route, qs] = h.split('?');
  if (!ROUTES.includes(route)) return { route: null, q: {} };
  const q = {};
  (qs || '').split('&').filter(Boolean).forEach((kv) => { const i = kv.indexOf('='); q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1) || ''); });
  return { route, q };
}
function applyRoute(route, q) {
  const h = '#' + route + (q && Object.keys(q).length ? '?' + Object.keys(q).map((k) => k + '=' + encodeURIComponent(q[k])).join('&') : '');
  if (location.hash === h) { onHash(); return; }
  location.hash = h;
}
function routeFromPath(path) {
  let p = String(path || '');
  const q = {};
  const oi = p.lastIndexOf('?open=');
  if (oi >= 0) { q.open = p.slice(oi + 6); p = p.slice(0, oi); }
  let route = 'today';
  if (p.startsWith('/inbox')) route = 'inbox';
  else if (p.startsWith('/planned')) route = 'planned';
  else if (p.startsWith('/review')) route = 'review';
  else if (p.startsWith('/settings')) route = 'settings';
  if (p.includes('weekly')) { route = 'review'; S.review.tab = 'weekly'; }
  else if (p.includes('log')) { route = 'review'; S.review.tab = 'log'; }
  return { route, q };
}
function onHash() {
  const { route, q } = parseHash();
  if (!route) { location.hash = '#today'; return; }
  S.route = route;
  renderView(q);
  renderNav();
}
window.addEventListener('hashchange', onHash);

/* ---------------- selector（三处今天同源） ---------------- */
const live = () => S.tasks.filter((t) => !t.deletedAt);
const byId = (id) => S.tasks.find((t) => t.id === id);
const todayPending = () => live().filter((t) => api.isPlannedToday(t, today()));
const todayDone = () => live().filter((t) => api.isDoneToday(t, today()));
const overdueList = () => live().filter((t) => api.isOverdue(t, today()));
const inboxList = () => live().filter((t) => !t.done && !t.plannedDate && !t.dueAt);
const upList = () => live().filter((t) => !t.done && ((t.dueAt && String(t.dueAt).slice(0, 10) > today()) || (t.plannedDate && t.plannedDate > today())));

function replaceTask(updated) {
  if (!updated) return;
  const i = S.tasks.findIndex((t) => t.id === updated.id);
  if (i >= 0) S.tasks[i] = updated; else S.tasks.unshift(updated);
}

/* ---------------- 任务动作 ---------------- */
async function toggleRow(id) {
  const t = byId(id);
  if (!t) return;
  const prev = t.done;
  t.done = !prev;
  S.failedId = null;
  renderView();
  const r = await api.toggleTask(id);
  if (r.err) { t.done = prev; S.failedId = id; renderView(); return; }
  replaceTask(r.data);
  renderView();
}
async function planToday(id) {
  const r = await api.updateTask(id, { plannedDate: today() });
  if (r.err) { toast(r.err, { kind: 'bad', ms: 5000 }); return; }
  replaceTask(r.data);
  renderView();
}
async function clearDue(id) {
  const r = await api.updateTask(id, { dueAt: null });
  if (r.err) { toast(r.err, { kind: 'bad', ms: 5000 }); return; }
  replaceTask(r.data);
  renderView();
}
function askDelete(id) {
  const t = byId(id);
  if (!t) return;
  S.confirm = { text: `删除「${t.title}」？删除后 10 秒内可以撤销，过期进回收站。`, okLabel: '删除', danger: true, run: () => doDelete(id) };
  renderModal();
}
async function doDelete(id) {
  const t = byId(id);
  const r = await api.deleteTask(id);
  if (r.err) { toast(r.err, { kind: 'bad', ms: 5000 }); return; }
  S.tasks = S.tasks.filter((x) => x.id !== id);
  if (S.expandedId === id) S.expandedId = null;
  render();
  startUndo(`已删除「${t ? t.title : ''}」`);
}
function startUndo(text) {
  if (S.undoTimer) clearInterval(S.undoTimer);
  S.toasts.undo = { text, kind: 'acc', action: '撤销', onAction: 'do-undo', countdown: true, left: 10 };
  renderToasts();
  S.undoTimer = setInterval(() => {
    const tt = S.toasts.undo;
    if (!tt) { clearInterval(S.undoTimer); S.undoTimer = null; return; }
    tt.left -= 1;
    if (tt.left <= 0) {
      delete S.toasts.undo;
      clearInterval(S.undoTimer); S.undoTimer = null;
      renderToasts();
      toast('撤销窗口已过 · 条目在回收站（30 天）', { ms: 5000 });
      return;
    }
    const l = $('undoLeft'); const b = $('undoBar');
    if (l) l.textContent = tt.left + 's · 过期后进回收站（30 天）';
    if (b) b.style.width = (tt.left * 10) + '%';
  }, 1000);
}
ACTS['do-undo'] = async () => {
  delete S.toasts.undo;
  if (S.undoTimer) { clearInterval(S.undoTimer); S.undoTimer = null; }
  renderToasts();
  const r = await api.undoDelete();
  if (r.err) { toast(r.err, { kind: 'bad', ms: 5000 }); softRefresh(); return; }
  if (r.data) { toast(`已恢复「${r.data.title}」`, { ms: 3000 }); replaceTask(r.data); render(); }
};

ACTS['toggle'] = (el) => toggleRow(el.dataset.id);
ACTS['retry-toggle'] = (el) => { S.failedId = null; toggleRow(el.dataset.id); };
ACTS['plan'] = (el) => planToday(el.dataset.id);
ACTS['clear-due'] = (el) => clearDue(el.dataset.id);
ACTS['del'] = (el) => askDelete(el.dataset.id);
ACTS['row-click'] = (el, e) => {
  if (e && (e.target.closest('.tcheck') || e.target.closest('.sw') || e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea'))) return;
  S.expandedId = S.expandedId === el.dataset.id ? null : el.dataset.id;
  renderView();
};

async function addFromInput(where) {
  const title = String(S.drafts[where] || '').trim();
  if (!title) { S.newErr = '标题不能为空，先写几个字'; renderView(); return; }
  S.newErr = '';
  const args = { title, category: '生活', priority: 'med', source: 'manual' };
  if (where === 'today') args.plannedDate = today();
  const r = await api.addTask(args);
  if (r.err) { S.newErr = r.err; renderView(); return; }
  replaceTask(r.data);
  S.drafts[where] = '';
  render();
  if (where === 'today') toast(`已记下并放进今天：「${r.data.title}」`, { ms: 3000 });
  focusNew(where);
}
function focusNew(where) {
  if (S.route !== where) applyRoute(where);
  setTimeout(() => { const el = $('new-' + where); if (el) el.focus(); }, 80);
}
ACTS['new-add-today'] = () => addFromInput('today');
ACTS['new-add-inbox'] = () => addFromInput('inbox');
ACTS['nav'] = (el) => applyRoute(el.dataset.arg);

/* ---------------- 渲染 ---------------- */
function render() { renderNav(); renderBanners(); onHash(); syncRecoveryLayer(); renderOverlays(); }

function renderNav() {
  $('nav').innerHTML = NAVS.map(([rt, label, ico], i) => {
    let n = '';
    if (rt === 'today') n = todayPending().length || '';
    if (rt === 'inbox') n = inboxList().length || '';
    if (rt === 'planned') n = upList().length || '';
    return `<button class="nav-item ${S.route === rt ? 'on' : ''}" data-act="nav" data-arg="${rt}" ${S.route === rt ? 'aria-current="page"' : ''}>
      <span class="nav-ico" aria-hidden>${ico}</span><span class="grow">${label}</span>
      <span class="nav-count mono">${n}</span><span class="kbd">${i + 1}</span></button>`;
  }).join('');
}
function renderBanners() {
  const b = [];
  if (S.bootErr) b.push(`<div class="bannerbar banner-warn">读不到本机数据：${esc(S.bootErr)}<button class="btn xs danger" data-act="boot-retry">重试</button></div>`);
  if (S.health && S.health.health === 'writeFailed') b.push(`<div class="bannerbar banner-warn">没有保存 —— ${esc(S.health.lastError || '磁盘拒绝写入')}；下次成功保存后自动恢复，期间可读。<button class="btn xs outline" data-act="health-recheck">重新检查</button><button class="btn xs outline" data-act="nav" data-arg="settings">看备份 →</button></div>`);
  if (S.migration) b.push(`<div class="bannerbar bg-accent">旧数据处理 ${migCount(S.migration)} 项已调整（无效时间 ${S.migration.invalidDates || 0} · 旧完成 ${S.migration.legacyDone || 0}），原件留档 <span class="mono">${esc(S.migration.archivedTo || 'data.v1.json')}</span><button class="btn xs outline" data-act="migration-ok">知道了</button></div>`);
  $('banners').innerHTML = b.join('');
}
function migCount(m) { return (m.taskCount || 0) + (m.reminderCount || 0) + (m.invalidDates || 0) + (m.legacyDone || 0); }
ACTS['boot-retry'] = () => boot();
ACTS['health-recheck'] = async () => {
  const r = await api.getDataHealth();
  if (r.err) { toast(r.err, { kind: 'bad', ms: 5000 }); return; }
  S.health = r.data;
  renderBanners();
  toast(r.data.health === 'ok' ? '磁盘已恢复可写' : `仍是 ${r.data.health === 'corrupt' ? '损坏' : '写失败'} 状态`, { ms: 3000 });
};
ACTS['migration-ok'] = async () => {
  if (S.migration && Object.keys(S.migration).length) {
    const r = await api.clearMigrationReport();
    if (r.err) { toast(r.err, { kind: 'bad', ms: 5000 }); return; }
  }
  S.migration = null;
  renderBanners();
};

const VIEWFNS = { today: viewToday, inbox: viewInbox, planned: viewPlanned, review: viewReview, settings: viewSettings };
function renderView(q) {
  const V = $('view');
  if (S.loading) { V.innerHTML = '<div class="skel" style="width:70%"></div><div class="skel" style="width:85%;margin-top:8px"></div><div class="skel" style="width:60%;margin-top:8px"></div>'; return; }
  if (S.bootErr) { V.innerHTML = `<div class="empty-hint" style="text-align:left">读不到本机数据：${esc(S.bootErr)}
      <div class="row-flex" style="margin-top:8px"><button class="btn sm" data-act="boot-retry">重试</button></div></div>`; return; }
  V.innerHTML = (VIEWFNS[S.route] || viewToday)();
  if (q && q.open && !V.querySelector(`[data-rowid='${cssSafe(q.open)}']`)) {
    const t = byId(q.open);
    if (t) {
      S.expandedId = t.id;
      V.innerHTML = (VIEWFNS[S.route] || viewToday)();
    } else {
      api.getTask(q.open).then((r) => {
        if (r.err) { toast(r.err, { kind: 'bad', ms: 4000 }); return; }
        if (r.data && !r.data.deletedAt) { replaceTask(r.data); S.expandedId = r.data.id; renderView(q); }
      }).catch(() => { /* 桥接层已归一 */ });
    }
  }
  if (q && q.open) {
    const row = V.querySelector(`[data-rowid='${cssSafe(q.open)}']`);
    if (row) { row.classList.add('flash'); row.scrollIntoView({ block: 'center' }); row.focus({ preventScroll: true }); }
  }
  if (q && q.open) S.focusRow = q.open;
  if (S.focusRow && document.activeElement === document.body) {
    const keep = V.querySelector(`[data-rowid='${cssSafe(S.focusRow)}']`);
    if (keep) keep.focus({ preventScroll: true });
  }
}
document.addEventListener('focusin', (e) => {
  const row = e.target && e.target.closest ? e.target.closest('[data-rowid]') : null;
  if (row) S.focusRow = row.dataset.rowid;
});
function cssSafe(s) { return String(s).replace(/["\\]/g, ''); }

function progressEl() {
  const total = todayDone().length + todayPending().length;
  const done = todayDone().length;
  return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
}
function newBar(where) {
  return `<div class="row-flex" style="gap:8px">
    <input class="input ${S.newErr ? 'invalid' : ''}" id="new-${where}" data-in="${where}" data-enter="new-add-${where}" value="${esc(S.drafts[where])}"
      placeholder="记一条，回车放进${where === 'today' ? '今天' : '收件箱'}" maxlength="200">
    <button class="btn icon" data-act="new-add-${where}" title="新建（Enter）" aria-label="新建">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>

function groupUpcoming() {

  for (const t of upList()) {
    const d = (t.dueAt && String(t.dueAt).slice(0, 10) > today()) ? String(t.dueAt).slice(0, 10) : t.plannedDate;
    if (!d) continue;
    if (!g.has(d)) g.set(d, []);

  return [...g.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1));
}

async function addReminderNow(timeVal, titleVal) {

  const r = await api.addReminder({ title, time: timeVal, category: '生活', repeat, enabled: true });
  if (r.err) { S.errs.remTime = r.err; delete S.errs.remPast; renderView(); return; }

  delete S.errs.remTitle; delete S.errs.remTime; delete S.errs.remPast;

ACTS['review-tab'] = (el) => { S.review.tab = el.dataset.arg; renderView(); };
function reviewLog() {
  const done = live().filter((t) => t.done)
    .sort((a, b) => String(b.doneAt || b.createdAt).localeCompare(String(a.doneAt || a.createdAt)));
  const w = api.weekWindow('current');
  const thisWeek = done.filter((t) => t.doneAt && String(t.doneAt).slice(0, 10) >= w.start && String(t.doneAt).slice(0, 10) <= w.end);
  const groups = new Map();
  for (const t of done) {
    const d = t.doneAt ? String(t.doneAt).slice(0, 10) : '旧版完成 · 时刻未记';
    if (!groups.has(d)) groups.set(d, []);
    groups.get(d).push(t);
  }
  const keys = [...groups.keys()].sort((a, b) => {
    const ad = /^\d{4}/.test(a); const bd = /^\d{4}/.test(b);
    if (ad && bd) return a < b ? 1 : -1;
    if (ad) return -1;
    if (bd) return 1;
    return 0;
  });
  let html = thisWeek.length === 0 ? `<div class="card"><span class="sm text-muted">这周还没完成事项。在「今天」勾掉第一条，它就会出现在这里。</span></div>` : '';
  html += keys.map((k) => `<div class="sec mono" style="margin-top:16px">${esc(k)}</div>` + groups.get(k).map((t) => `<div class="trow" tabindex="0" data-rowid="${esc(t.id)}" data-act="row-click" data-id="${esc(t.id)}">
      <span aria-hidden class="text-muted">✓</span><span class="grow truncate sm">${esc(t.title)}</span>
      ${t.legacy ? '<span class="badge">旧版 · 时间未记</span>' : ''}
      <span class="cat ${api.getCategoryColor(t.category)}">${esc(t.category)}</span>
      <code class="tmeta mono">${t.doneAt && String(t.doneAt).length > 10 ? esc(String(t.doneAt).slice(11, 16)) : ''}</code>
    </div>${S.expandedId === t.id ? detailEl(t) : ''}`).join('')).join('');
  if (!done.length) html = `<div class="empty-hint">还没有完成记录。先去「今天」勾掉一条。</div>`;
  return html;
}
function reviewItems(which) {
  const w = api.weekWindow(which);
  const done = live().filter((t) => t.done && t.doneAt && String(t.doneAt).slice(0, 10) >= w.start && String(t.doneAt).slice(0, 10) <= w.end)
    .sort((a, b) => String(a.doneAt).localeCompare(String(b.doneAt)));
  const carried = live().filter((t) => !t.done && api.isCarry(t));
  const byCat = { 工作: 0, 学习: 0, 生活: 0 };
  for (const t of done) byCat[t.category] = (byCat[t.category] || 0) + 1;
  return { w, done, carried, catLine: `工作 ${byCat['工作']} · 学习 ${byCat['学习']} · 生活 ${byCat['生活']}` };
}

          <input type="checkbox" class="tcheck" ${S.review.excl.has(t.id) ? '' : 'checked'} data-row-act="draft-excl" data-id="${esc(t.id)}" aria-label="入选周汇总 ${esc(t.title)}">

      else if (a === 'hotkey-apply') { S.drafts.hotkey = e.target.value; ACTS['hotkey-apply'](); }
      else if (a === 'mainhot-apply') { S.drafts.mainHotkey = e.target.value; ACTS['mainhot-apply'](); }
      else if (a === 'dir-save') { S.drafts.dir = e.target.value; ACTS['dir-save'](); }
      else if (a === 'export-retry') { S.drafts.retry = e.target.value; ACTS['export-retry'](); }
      else e.target.blur();
    } else if (e.key === 'Enter' && e.target.dataset && e.target.dataset.in === 'sub') {
      const btn = document.querySelector('[data-act="sub-add"]');
      if (btn) { e.stopPropagation(); btn.click(); }
    } else if (e.key === 'Enter' && e.target.dataset && e.target.dataset.in === 'noteNew') {
      const btn = document.querySelector('[data-act="note-add"]');
      if (btn) { e.stopPropagation(); btn.click(); }
    } else if (e.key === 'Enter' && e.target.dataset && ['remTimes', 'remTitle', 'remDate'].includes(e.target.dataset.in)) {
      const btn = document.querySelector('[data-act="rem-add"]');
      if (btn) btn.click();
    } else if (e.key === 'Enter' && e.target.dataset && ['remEditTimes', 'remEditDate'].includes(e.target.dataset.in)) {
      const btn = document.querySelector('[data-act="rem-edit-save"]');
      if (btn) btn.click();
    }
    return;
  }
  if (e.target && e.target.type === 'checkbox') return;
  if (e.target && (e.target.tagName === 'BUTTON' || e.target.tagName === 'A')) return;
  if (S.settings && !S.settings.onboarded && S.onb.step < 4) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); openSearch(''); return; }
  if (/^[1-5]$/.test(e.key)) { e.preventDefault(); applyRoute(ROUTES[+e.key - 1]); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); rowNavDelta(1); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); rowNavDelta(-1); return; }
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); focusNew(S.route === 'inbox' ? 'inbox' : 'today'); return; }
  const fid = focusedRowId();
  if (e.key === ' ' && fid) { e.preventDefault(); toggleRow(fid); return; }
  if ((e.key === 't' || e.key === 'T') && fid) { e.preventDefault(); planToday(fid); return; }
  if (e.key === 'Enter' && fid) { e.preventDefault(); S.expandedId = S.expandedId === fid ? null : fid; renderView(); return; }
  if (e.key.length === 1 && e.key !== ' ' && (document.activeElement === document.body || (document.activeElement && document.activeElement.closest && document.activeElement.closest('#main')))) {
    e.preventDefault();
    openSearch(e.key);
  }
});

/* 搜索 debounce 150ms + 骨架（本地计算，无假延时） */
$('overlayRoot').addEventListener('input', (e) => {
  if (!(e.target && e.target.id === 'searchInput')) return;
  S.search.q = e.target.value;
  S.search.busy = true;
  S.search.sel = 0;
  renderSearch();
  if (searchDebTimer) clearTimeout(searchDebTimer);
  searchDebTimer = setTimeout(() => {
    S.search.busy = false;
    S.search.debounced = S.search.q;
    renderSearch();
  }, 150);
});

/* ---------------- 事件订阅 ---------------- */
api.onEvent('store-changed', () => softRefresh());
api.onEvent('hotkey-state', (p) => {
  if (!p) return;
  S.hotkeys = p;
  if (S.route === 'settings') renderView();
});
api.onEvent('theme-changed', (theme) => {
  api.applyTheme(theme);
  if (S.settings) S.settings.theme = theme;
  if (S.route === 'settings') renderView();
});
api.onEvent('navigate', (route) => {
  const { route: r, q } = routeFromPath(route);
  applyRoute(r || 'today', q);
  blurFocusedInput();
});
api.onEvent('open-capture', () => {
  if (!S.capFallback) { S.capFallback = { text: '', err: '快速记录条没就绪，已在这里兜底（回车落库）', parsed: null }; renderOverlays(); }
});
api.onEvent('capture-opened', () => { if (S.capFallback) { S.capFallback = null; renderOverlays(); } });
window.addEventListener('focus', () => {
  const pr = api.takePendingRoute();
  if (pr) { const { route, q } = routeFromPath(pr); applyRoute(route || 'today', q); }
});
window.addEventListener('storage', (e) => {
  if (e && e.key === 'kettd.pending-route') {
    const pr = api.takePendingRoute();
    if (pr) { const { route, q } = routeFromPath(pr); applyRoute(route || 'today', q); }
  }
});

render();
boot().then(() => {
  const { route, q } = parseHash();
  if (!route) { location.hash = '#today'; onHash(); }
  else { S.route = route; renderView(q); renderNav(); syncRecoveryLayer(); }
});
  </script>
</body>
